<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
   <H1>Hello User</H1>
   <div id="user-wish">
    
    </div>
    <script>
    var msg="";
    var today= new Date();            // Date objects are created with the new Date() constructor
    var day= today.getDay();        // Get the day of the week
    //alert(day);
    if(day==4|| day==0)             //Saturday value is equal to 6 and Sunday value is equal to 0
    {
       // If day is equal to 6 or 0 then the message will be we are closed 
    document.getElementById("user-wish").style.color="red";    
    document.getElementById("user-wish").innerHTML="We are CLOSED";
    }
    else
    {
    document.getElementById("user-wish").style.color="blue";
    document.getElementById("user-wish").innerHTML="We are OPEN";
    }
    </script>
</body>
</html>
