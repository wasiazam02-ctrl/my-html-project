<!DOCTYPE html>
<html>

   <head>
      <title>HTML Unordered List</title>
   </head>
   <body>
   
      <ul type='square'>  
          <li>Delhi</li>
         <li>Bombay</li>
         <li>Chennai</li>
         <li>Kolkata</li>
      </ul>
	  
	  <ul type='disc'> 
          <li>Delhi</li>
         <li>Bombay</li>
         <li>Chennai</li>
         <li>Kolkata</li>
      </ul>
	  
	  <ul type='circle'> 
          <li>Delhi</li>
         <li>Bombay</li>
         <li>Chennai</li>
         <li>Kolkata</li>
      </ul>
     
   </body>	
</html>
